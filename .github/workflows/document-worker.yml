name: WerkMatch document worker

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: werkmatch-document-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: dependency-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit
      - name: Install pinned Tectonic
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tectonic"
          curl -fsSL \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/tectonic.tar.gz"
          echo "1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tectonic"
          echo "$RUNNER_TEMP/tectonic" >> "$GITHUB_PATH"
      - name: Process queued requests
        run: node --experimental-strip-types scripts/run-document-worker.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_DOCUMENT_MODEL: gpt-5.6-luna
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCUMENT_WORKER_BATCH_SIZE: '4'
